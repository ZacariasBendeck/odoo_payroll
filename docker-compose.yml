services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo:18.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./payroll:/mnt/extra-addons/payroll
      - ./payroll_account:/mnt/extra-addons/payroll_account
      - odoo-web-data:/var/lib/odoo
    command:
      odoo --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
      --db_host=db --db_user=odoo --db_password=odoo
    restart: unless-stopped

volumes:
  odoo-db-data:
  odoo-web-data:
